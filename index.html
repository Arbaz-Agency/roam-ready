<!doctype html>
<html lang="en">
  <head>
    <!--
      Counterpart to public/404.html's redirect: on GitHub Pages, a deep link
      that 404'd gets bounced here with the real path folded into the query
      string. This restores the actual URL via history.replaceState before
      React Router mounts, so the app never sees the detour.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1F2C22" />

    <title>Roam Ready | Curated Journeys Across India</title>
    <meta
      name="description"
      content="Roam Ready designs curated journeys across the Himalayas, Rajasthan and beyond — mountain escapes, spiritual trails and slow, well-planned travel."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Fraunces is requested with its SOFT and WONK axes so the editorial
         italic accent actually varies; Manrope carries UI and body copy.
         display=swap keeps text visible while the faces load. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
