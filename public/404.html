<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roam Ready</title>
    <!--
      GitHub Pages has no server-side rewrite, so a hard visit or refresh on a
      deep link (e.g. /roam-ready/packages/kashmir) hits this 404 page instead
      of the app. This encodes the intended path into a query string and sends
      the browser back to index.html, which decodes it and restores the real
      URL before React Router ever sees it. Standard technique:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentsToKeep = 1 // keep "/roam-ready"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
